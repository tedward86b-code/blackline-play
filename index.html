	function hookWorklet(ctx) {

		if (!aw || aw.__blHooked || typeof aw.addModule !== 'function') {
			console.log('worklet status', window.__blWorkletStatus, 'no addModule', ctx.state);
			return;
		}
		aw.__blHooked = true;
		var orig = aw.addModule.bind(aw);
		aw.addModule = function (moduleUrl, options) {
			console.log('worklet addModule', moduleUrl, 'state', ctx.state);
			function attempt() {
				return orig(moduleUrl, options).then(function (result) {
					window.__blWorkletStatus = 'loaded';
					console.log('worklet loaded', moduleUrl, 'state', ctx.state);
					return result;
				});
			}
			return attempt().catch(function (err) {
				window.__blWorkletStatus = 'rejected';
				console.error('worklet addModule rejected', moduleUrl, 'state', ctx.state, err);
				return new Promise(function (resolve, reject) {
					var ran = false;
					function retry() {
						if (ran) {
							return;
						}
						ran = true;
						console.log('worklet retry', moduleUrl, 'state', ctx.state);
						attempt().then(function (result) {
							window.__blWorkletStatus = 'loaded-retry';
							console.log('worklet retry ok', ctx.state);
							resolve(result);
						}, function (err2) {
							window.__blWorkletStatus = 'rejected-retry';
							console.error('worklet retry failed', err2);
							reject(err2);
						});
					}
					if (ctx.state === 'running') {
						retry();
						return;
					}
					retries.push(retry);
					ctx.addEventListener('statechange', function onState() {
						if (ctx.state === 'running') {
							ctx.removeEventListener('statechange', onState);

		} catch (err) {
			console.error('AudioContext constructor failed, retrying without options', err);
			ctx = new Native();
		}
		remember(ctx);
		hookWorklet(ctx);
		console.log('AudioContext created', ctx.state, 'sampleRate', ctx.sampleRate, 'worklet', window.__blWorkletStatus);

		}

	}

	Patched.__blackline = true;
	window.AudioContext = Patched;
	if (window.webkitAudioContext) {
		window.webkitAudioContext = Patched;
	}
	function logContexts(label) {
		if (!contexts.length) {
			console.log(label, 'missing', 'worklet', window.__blWorkletStatus);
			return;
		}
		contexts.forEach(function (ctx) {
			console.log(label, ctx.state, 'worklet', window.__blWorkletStatus);
		});
	}
	function flushRetries() {
		var pending = retries.splice(0, retries.length);
		pending.forEach(function (retry) {
			retry();
		});
	}
	window.__blResumeAudio = function () {
		logContexts('AudioContext state');
		contexts.forEach(function (ctx) {
			if (!ctx || ctx.state === 'closed' || ctx.state === 'running') {
				return;
			}
			ctx.resume().then(function () {
				console.log('AudioContext state', ctx.state, 'worklet', window.__blWorkletStatus);
				flushRetries();
			}, function (err) {
				console.error('AudioContext resume failed', err);
			});
		});
	};
	var unlocked = false;
	function unlock() {
		if (unlocked) {
			return;
		}
		unlocked = true;
		window.__blAudioUnlocked = true;
		try {
			if (navigator.audioSession) {
				navigator.audioSession.type = 'playback';
				console.log('audioSession', navigator.audioSession.type);
			}
		} catch (err) {
			console.error('audioSession', err);
		}
		var el = document.getElementById('bl-silent');
		if (el) {
			var played = el.play();
			if (played && played.catch) {
				played.catch(function (err) {
					console.error('silent audio', err);
				});
			}
		}
		logContexts('AudioContext state before resume');
		window.__blResumeAudio();
		flushRetries();
	}
	var listen = { capture: true, passive: true, once: true };
	['touchstart', 'touchend', 'pointerdown', 'click'].forEach(function (type) {
		window.addEventListener(type, unlock, listen);
	});
})();

// iOS Safari will pan, double-tap zoom, and pinch the page unless the canvas
// itself refuses the gesture. Godot's own listener is not always registered
// with passive:false for the gesture events, which only exist on WebKit.
(function () {
	var stop = function (ev) { ev.preventDefault(); };
	["gesturestart", "gesturechange", "gestureend"].forEach(function (name) {
		document.addEventListener(name, stop, { passive: false });
	});
	document.addEventListener("touchmove", stop, { passive: false });
	var drop = function () {
		var fn = window.blacklineDropFingers;
		if (typeof fn === "function") {
			fn();
		}
	};
	document.addEventListener("visibilitychange", function () {
		if (document.hidden) {
			drop();
		} else if (window.__blResumeAudio) {
			window.__blResumeAudio();
		}
	});
	window.addEventListener("focus", function () {
		if (window.__blResumeAudio) {
			window.__blResumeAudio();
		}
	});
	window.addEventListener("pagehide", drop);
	window.addEventListener("blur", drop);
}());

		console.error(err);
